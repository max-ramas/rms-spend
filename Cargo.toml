[package]
name = "rms-spend"
version = "0.1.0"
edition = "2021"
description = "IDE-native AI token spend tracker — local ledger, no network interception"
license = "MIT"
authors = ["RMS Digital Services"]

[[bin]]
name = "rms-spend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
walkdir = "2"
ratatui = "0.29"
crossterm = "0.28"
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
